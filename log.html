<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evolution Log</title>
<meta name="description" content="Every evolution of Evolving Life, with a snapshot, what changed, and observations.">
<style>
  :root { --bg:#0d0f14; --panel:#151922; --line:#262c38; --text:#e6e9ef; --muted:#8a93a6; --accent:#5fd38d; --self:#8fb3ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { display:flex; align-items:baseline; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; } header a { color:var(--muted); text-decoration:none; margin-left:auto; }
  .wrap { max-width:980px; margin:0 auto; padding:16px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:28px 0 10px; }
  .obs { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 16px; margin-bottom:10px; }
  .obs time { color:var(--muted); font-size:12px; }
  .obs p { margin:6px 0 0; }
  .chart { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .chart svg { width:100%; height:120px; display:block; }
  .legend { color:var(--muted); font-size:12px; display:flex; gap:14px; flex-wrap:wrap; }
  .entry { display:grid; grid-template-columns:240px minmax(0,1fr); gap:14px; padding:14px 0; border-bottom:1px solid var(--line); }
  @media (max-width:640px) { .entry { grid-template-columns:1fr; } }
  .entry img { width:100%; image-rendering:pixelated; border-radius:6px; border:1px solid var(--line); display:block; }
  .meta { color:var(--muted); font-size:12px; }
  .title { font-size:17px; font-weight:650; margin:2px 0 4px; }
  .tag { font-size:11px; padding:1px 7px; border-radius:10px; border:1px solid var(--line); margin-left:6px; vertical-align:2px; }
  .tag.self { color:var(--self); border-color:#2d3d63; } .tag.authored { color:var(--accent); border-color:#24503a; }
  details { margin-top:6px; color:var(--muted); font-size:13px; } summary { cursor:pointer; }
  code { font-size:12px; color:#c4cad6; }
  .empty { color:var(--muted); }
</style>
</head>
<body>
<header><h1>Evolution log</h1><span style="color:var(--muted)" id="sub"></span><a href="./">← Back to the game</a></header>
<div class="wrap">
  <h2>Observations</h2>
  <div id="obs"><p class="empty">No observations yet.</p></div>
  <h2>Life over time</h2>
  <div class="chart"><svg id="chart" viewBox="0 0 1000 120" preserveAspectRatio="none"></svg>
    <div class="legend"><span><b style="color:var(--accent)">—</b> share of board alive (reference world)</span><span><b style="color:var(--self)">—</b> tribes alive</span></div></div>
  <h2>Evolutions, newest first</h2>
  <div id="list"><p class="empty">Loading…</p></div>
</div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n\n/g, '</p><p>');
(async () => {
  const get = async (u) => { try { const r = await fetch(u + '?t=' + Date.now(), { cache: 'no-store' }); return r.ok ? r.json() : null; } catch { return null; } };
  const [log, obs] = await Promise.all([get('log.json'), get('observations.json')]);
  if (obs && obs.entries && obs.entries.length) document.getElementById('obs').innerHTML = obs.entries.slice().reverse().map((o) => `<div class="obs"><time>${esc(o.date)}${o.upTo ? ' · through evolution ' + o.upTo : ''}</time><p>${md(o.text)}</p></div>`).join('');
  const entries = (log && log.entries) || [];
  document.getElementById('sub').textContent = entries.length ? `${entries.length} evolutions · updated ${new Date(log.updatedAt).toLocaleString()}` : '';
  if (!entries.length) { document.getElementById('list').innerHTML = '<p class="empty">No evolutions logged yet.</p>'; return; }
  // chart
  const W = 1000, H = 120, n = entries.length, x = (i) => n === 1 ? W / 2 : i * W / (n - 1);
  const maxD = Math.max(0.05, ...entries.map((e) => e.stats.density));
  const dens = entries.map((e, i) => `${x(i).toFixed(1)},${(H - 6 - (e.stats.density / maxD) * (H - 12)).toFixed(1)}`).join(' ');
  const tribes = entries.map((e, i) => `${x(i).toFixed(1)},${(H - 6 - (e.stats.tribes.filter((p) => p > 0).length / 6) * (H - 12)).toFixed(1)}`).join(' ');
  document.getElementById('chart').innerHTML = `<polyline points="${tribes}" fill="none" stroke="#8fb3ff" stroke-width="1.5" vector-effect="non-scaling-stroke" opacity=".7"/><polyline points="${dens}" fill="none" stroke="#5fd38d" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
  document.getElementById('list').innerHTML = entries.slice().reverse().map((e) => `
    <div class="entry" id="e${e.n}">
      <img loading="lazy" src="${esc(e.snapshot)}" alt="Snapshot of evolution ${e.n}" width="384" height="240">
      <div>
        <div class="meta">Evolution ${e.n} · ${new Date(e.at).toLocaleString()} <span class="tag ${e.kind}">${e.kind === 'self' ? 'chosen by the game' : 'written by Claude'}</span>${e.rescue ? '<span class="tag">rescue genesis</span>' : ''}</div>
        <div class="title">${esc(e.title)}</div>
        <div>${esc(e.desc)}</div>
        <div class="meta" style="margin-top:6px">Rule <code>${esc(e.rule)}</code> · ${(e.stats.density * 100).toFixed(1)}% alive · tribes ${e.stats.tribes.join(' / ')}</div>
        ${e.considered && e.considered.length ? `<details><summary>What the game considered</summary>${e.considered.map((c) => `<div>${esc(c.title)} <code>${c.op}</code> fitness ${c.score}</div>`).join('')}</details>` : ''}
      </div>
    </div>`).join('');
})();
</script>
</body>
</html>
